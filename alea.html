<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEA — Wahrscheinlichkeitslabor</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --line:#2a3140;
    --text:#e8ecf1; --muted:#8b95a5;
    --a:#3ddc97; --b:#ff6b6b; --accent:#6cb6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
  header{display:flex;align-items:baseline;gap:16px;margin-bottom:24px}
  h1{font-size:1.6rem;letter-spacing:.04em}
  .tag{color:var(--muted);font-size:.85rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h2{font-size:1rem;margin-bottom:12px;color:var(--muted);font-weight:600}
  button{background:var(--accent);color:#041018;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px}
  .side{text-align:center}
  .side .val{font-size:1.5rem;font-weight:800}
  .side.a .val{color:var(--a)} .side.b .val{color:var(--b)}
  .vs{color:var(--muted);font-weight:700}
  .bar{height:10px;border-radius:5px;background:#243041;overflow:hidden;display:flex;margin-top:6px}
  .bar > span{height:100%}
  .bar .ba{background:var(--a)} .bar .bb{background:var(--b)}
  .hist{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:8px}
  .hist div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:0;opacity:.85}
  .stats{font-size:.85rem;color:var(--muted);margin-top:8px;line-height:1.5}
  .live{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .votes{display:flex;gap:10px;margin-top:8px}
  .votes b{font-size:1.2rem}
  footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>ALEA</h1>
  <span class="tag">Wahrscheinlichkeitslabor · Prototyp</span>
</header>

<div class="grid">
  <div class="card">
    <h2>Vergleichsrunde</h2>
    <div class="row">
      <button onclick="newRound()">Neue Runde</button>
      <button class="ghost" onclick="rollAll()">Alle dreimal würfeln</button>
    </div>
    <div id="comps"></div>
    <div class="live">
      <div>Zuschauer-Abstimmung (Prototyp)</div>
      <div class="votes">
        <div>Links <b id="vL">0</b></div>
        <div>Rechts <b id="vR">0</b></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button onclick="vote('L')">Links</button>
        <button onclick="vote('R')">Rechts</button>
        <button class="ghost" onclick="resetVotes()">Zurücksetzen</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Histogramm · 4W6</h2>
    <div class="row">
      <button onclick="buildHist()">200 Würfe</button>
      <button class="ghost" onclick="buildHist(1000)">1000 Würfe</button>
    </div>
    <div class="hist" id="hist"></div>
    <div class="stats" id="hstats"></div>
  </div>
</div>

<footer>ALEA Prototyp · gebaut mit Grok · Oktober 2026</footer>

<script>
const EXP = [
  {name:"2W6 vs 1W12", a:()=>sum(roll(2,6)), b:()=>sum(roll(1,12))},
  {name:"3W6 vs 2W10", a:()=>sum(roll(3,6)), b:()=>sum(roll(2,10))},
  {name:"4W6 vs 2W12", a:()=>sum(roll(4,6)), b:()=>sum(roll(2,12))}
];
function roll(n,s){return Array.from({length:n},()=>1+Math.floor(Math.random()*s))}
function sum(xs){return xs.reduce((a,b)=>a+b,0)}
function mean(xs){return xs.length?sum(xs)/xs.length:0}
function std(xs){const m=mean(xs);return Math.sqrt(mean(xs.map(x=>(x-m)**2)))}

let votes={L:0,R:0);
function vote(s){votes[s]+=1;document.getElementById('vL').textContent=votes.L;document.getElementById('vR').textContent=votes.R}
function resetVotes(){votes={L:0,R:0};document.getElementById('vL').textContent=0;document.getElementById('vR').textContent=0}

function newRound(){
  const box=document.getElementById('comps'); box.innerHTML='';
  EXP.forEach((e,i)=>{
    const va=e.a(), vb=e.b();
    const bar=(va+vb)?`width:${100*va/(va+vb)}%`:'width:50%';
    box.innerHTML+=`<div class="cmp">
      <div class="side a"><div>${e.name.split(' vs ')[0]}</div><div class="val">${va}</div></div>
      <div class="vs">VS</div>
      <div class="side b"><div>${e.name.split(' vs ')[1]}</div><div class="val">${vb}</div></div>
      <div class="bar" style="grid-column:1/-1"><span class="ba" style="${bar}"></span><span class="bb"></span></div>
    </div>`;
  });
}
function rollAll(){for(let i=0;i<3;i++)newRound()}

function buildHist(n=200){
  const c={}; for(let i=0;i<n;i++){const t=sum(roll(4,6));c[t]=(c[t]||0)+1}
  const keys=Object.keys(c).map(Number).sort((a,b)=>a-b);
  const max=Math.max(...Object.values(c));
  const h=document.getElementById('hist'); h.innerHTML='';
  keys.forEach(k=>{h.innerHTML+=`<div title="${k}: ${c[k]}" style="height:${100*c[k]/max}%"></div>`});
  const xs=[]; for(let i=0;i<n;i++)xs.push(sum(roll(4,6)));
  document.getElementById('hstats').innerHTML=
    `n=${n} · Mittelwert ${mean(xs).toFixed(2)} · StdAbw ${std(xs).toFixed(2)} · Min ${Math.min(...xs)} · Max ${Math.max(...xs)}`;
}
newRound(); buildHist();
</script>
</body>
</html>
